name: Pipeline diario

# Corre el scraping de las 3 fuentes (INA, Yacyreta, Prefectura Naval) y
# actualiza el historico en Postgres (Neon). Se puede disparar a mano desde
# la pestaña Actions de GitHub con "Run workflow" ademas del horario fijo.
on:
  schedule:
    # 12:00 UTC = 09:00 en Argentina (ART, UTC-3). Los boletines de las
    # fuentes suelen publicarse a la manana.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m data_pipeline.main

      # Va despues del pipeline y como paso aparte (no dentro de
      # data_pipeline/) para que el scraping no dependa del envio de mails ni
      # al reves: si Resend se cae, el dato del dia igual quedo guardado, y en
      # el log de Actions se ve en cual de las dos cosas fallo.
      - name: Avisar por mail los umbrales cruzados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_REMITENTE: ${{ secrets.MAIL_REMITENTE }}
        run: python -m backend.notificaciones
