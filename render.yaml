services:
  - type: web
    name: algorio-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Remitente verificado en Resend. Sin esto se usa el dominio de prueba,
      # que solo entrega al mail de la cuenta dueña de la API key.
      - key: MAIL_REMITENTE
        sync: false
      - key: MAIL_SOPORTE
        sync: false
